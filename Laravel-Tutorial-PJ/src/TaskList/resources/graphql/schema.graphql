scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

enum TaskStatus {
    TODO @enum(value: 1)
    DOING @enum(value: 2)
    DONE @enum(value: 3)
}

type User {
    id: ID!
    name: String!
    email: String!
}

type Folder {
    id: ID!
    title: String!
    tasks_url: String!
}

type Task {
    id: ID!
    folder_id: ID!
    title: String!
    status: TaskStatus!
    due_date: Date!
    edit_url: String!
    delete_url: String!
}

type PaginatorInfo {
    currentPage: Int!
    lastPage: Int!
    hasMorePages: Boolean!
}

type TaskPage {
    data: [Task!]!
    paginatorInfo: PaginatorInfo!
}

type DeleteResult {
    id: ID!
    deleted: Boolean!
}

type FolderPage {
    data: [Folder!]!
    paginatorInfo: PaginatorInfo!
}

input CreateFolderInput {
    title: String!
}

input CreateTaskInput {
    title: String!
    due_date: String!
}

input UpdateTaskInput {
    title: String!
    status: TaskStatus!
    due_date: String!
}

enum GmailScope { GITHUB BIZMATES }

type TaskExtraction {
    id: ID!
    scope: GmailScope!
    status: String!
    read_count: Int!
    candidate_count: Int!
    duplicate_count: Int!
    skipped_count: Int!
    trigger: String!
    attempt: Int!
    retry_of: ID
    retry_at: DateTime
    stage: String!
    total_count: Int
    scanned_count: Int!
    batch_count: Int!
    has_more: Boolean!
    created_at: DateTime!
    completed_at: DateTime
    error: String
}

type TaskCandidate {
    id: ID!
    message_id: String!
    subject: String!
    sender: String!
    received_at: String!
    title: String!
    description: String!
    reason: String!
    evidence: String!
    due_date: Date
    status: String!
    task_id: ID
}

type CandidateInbox {
    enabled: Boolean!
    account: String
    run: TaskExtraction
    candidates: [TaskCandidate!]!
}

type GmailConnectionState {
    can_manage: Boolean!
    status: String!
    account: String
    verified_at: String
    error: String
    service_status: String!
    retry_after: Int!
}

type GmailAutomationState {
    enabled: Boolean!
    time: String!
    scope: GmailScope!
    timezone: String!
    next_run_at: String
    last_run_at: String
    worker_online: Boolean!
}

input GmailAutomationInput {
    enabled: Boolean!
    time: String!
    scope: GmailScope!
}

type Query {
    gmailAutomation: GmailAutomationState! @field(resolver: "App\\GraphQL\\GmailAutomationOperations@state")
    gmailExtractionHistory: [TaskExtraction!]! @field(resolver: "App\\GraphQL\\GmailAutomationOperations@history")
    gmailConnection: GmailConnectionState! @field(resolver: "App\\GraphQL\\GmailConnectionOperations@state")
    candidateInbox: CandidateInbox! @field(resolver: "App\\GraphQL\\TaskCandidateOperations@inbox")
    me: User! @field(resolver: "App\\GraphQL\\TaskOperations@me")
    folders(page: Int = 1, first: Int = 20): FolderPage!
        @field(resolver: "App\\GraphQL\\TaskOperations@folders")
    tasks(folder_id: ID!, status: TaskStatus, page: Int = 1, first: Int = 20): TaskPage!
        @field(resolver: "App\\GraphQL\\TaskOperations@tasks")
    task(folder_id: ID!, id: ID!): Task
        @field(resolver: "App\\GraphQL\\TaskOperations@task")
}

type Mutation {
    updateGmailAutomation(input: GmailAutomationInput!): GmailAutomationState @field(resolver: "App\\GraphQL\\GmailAutomationOperations@save")
    retryGmailExtraction(id: ID!): TaskExtraction @field(resolver: "App\\GraphQL\\GmailAutomationOperations@retry")
    createFolder(input: CreateFolderInput!): Folder @field(resolver: "App\\GraphQL\\TaskOperations@createFolder")
    connectGmail: GmailConnectionState @field(resolver: "App\\GraphQL\\GmailConnectionOperations@connect")
    disconnectGmail(confirm: Boolean!): GmailConnectionState @field(resolver: "App\\GraphQL\\GmailConnectionOperations@disconnect")
    extractGmailTasks(scope: GmailScope!): TaskExtraction @field(resolver: "App\\GraphQL\\TaskCandidateOperations@start")
    acceptTaskCandidate(id: ID!, folder_id: ID!, input: CreateTaskInput!): Task @field(resolver: "App\\GraphQL\\TaskCandidateOperations@accept")
    dismissTaskCandidate(id: ID!): TaskCandidate @field(resolver: "App\\GraphQL\\TaskCandidateOperations@dismiss")
    deleteTask(folder_id: ID!, id: ID!, confirm: Boolean!): DeleteResult
        @field(resolver: "App\\GraphQL\\TaskOperations@deleteTask")
    createTask(folder_id: ID!, input: CreateTaskInput!): Task
        @field(resolver: "App\\GraphQL\\TaskOperations@createTask")
    updateTask(folder_id: ID!, id: ID!, input: UpdateTaskInput!): Task
        @field(resolver: "App\\GraphQL\\TaskOperations@updateTask")
    updateTaskStatus(folder_id: ID!, id: ID!, status: TaskStatus!): Task
        @field(resolver: "App\\GraphQL\\TaskOperations@updateTaskStatus")
}

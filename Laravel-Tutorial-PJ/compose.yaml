services:
  php:
    restart: "no"
    build: ./docker/php
    working_dir: /var/www/TaskList
    volumes:
      - ./src:/var/www
  scheduler:
    extends:
      service: php
    image: ${COMPOSE_PROJECT_NAME:-laravel-tutorial-pj}-php
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - db
  nginx:
    restart: "no"
    image: nginx:stable
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./src:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
  mailpit:
    restart: "no"
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:8025:8025"
  db:
    restart: "no"
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mysql_test_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Tokyo
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

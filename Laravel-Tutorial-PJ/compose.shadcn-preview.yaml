services:
  shadcn-php:
    image: laravel-tutorial-pj-php
    working_dir: /var/www/TaskList
    restart: "no"
    volumes:
      - ./src:/var/www
      - ${TASKLIST_DEPENDENCIES_PATH:?Set the original TaskList application path}/vendor:/var/www/TaskList/vendor:ro
    networks:
      - tasklist
  shadcn-nginx:
    image: nginx:stable
    restart: "no"
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./src:/var/www:ro
      - ./docker/nginx/shadcn-preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - shadcn-php
    networks:
      - tasklist
networks:
  tasklist:
    external: true
    name: laravel-tutorial-pj_default
